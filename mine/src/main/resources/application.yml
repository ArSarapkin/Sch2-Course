server:
  port: 8081

spring:
  application:
    name: mine
  config:
    # .env лежит в корне проекта: первый путь — запуск из корня (IDE, java -jar), второй — из папки модуля (bootRun, тесты)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # схема ведётся в db/ в корне проекта, Hibernate её не трогает
      ddl-auto: none

app:
  admin:
    key: ${ADMIN_KEY}
  dig:
    # вероятность типа добытого ресурса в процентах, сумма должна быть 100
    resource-chances:
      DIRT: 30
      STONE: 25
      CLAY: 17
      COAL: 12
      COPPER: 7
      IRON: 5
      GOLD: 2
      DIAMOND: 1
      TITAN: 1
